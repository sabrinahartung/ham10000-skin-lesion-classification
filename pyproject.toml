[project]
name = "ml-training-dojo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sabrina Hartung", email = "sabrina.hartung@haw-hamburg.de" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.6.2",
    "kaleido>=1.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "plotly>=6.9.0",
    "scikit-learn>=1.9.0",
    "st-clickable-images>=0.0.3",
    "streamlit>=1.61.1",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[project.scripts]
ml-training-dojo = "ml_training_dojo:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
